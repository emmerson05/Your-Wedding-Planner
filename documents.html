<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Documents · Your Wedding Planner</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#08A0FF" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="topbar-title">Documents</div>
      <div style="width:36px;"></div>
    </div>

    <div class="scroll-content">
      <p class="tagline" style="text-align:left; margin-bottom:20px;">Keep quotes, contracts and inspiration all in one place.</p>

      <div class="card" id="emptyState" style="text-align:center; padding: 40px 20px;">
        <div style="font-size:36px;">📁</div>
        <div style="font-weight:700; margin-top:12px;">No documents yet</div>
        <div class="tagline" style="margin-top:4px;">Add your first quote, contract or inspiration photo.</div>
      </div>

      <div id="docList"></div>

      <button class="btn btn-secondary" onclick="addSampleDoc()">+ Add Document</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    WeddingApp.requireAccount();
    WeddingApp.requireOnboarding();

    function render() {
      const state = WeddingApp.getState();
      const list = document.getElementById('docList');
      list.innerHTML = '';
      document.getElementById('emptyState').style.display = state.documents.length ? 'none' : 'block';
      state.documents.forEach((d) => {
        const row = document.createElement('div');
        row.className = 'card';
        row.style.cssText = 'display:flex; align-items:center; gap:12px;';
        row.innerHTML = `<span style="font-size:22px;">${d.icon}</span><div><div style="font-weight:700;">${d.name}</div><div style="font-size:12px; color:var(--color-text-muted);">${d.type}</div></div>`;
        list.appendChild(row);
      });
    }

    function addSampleDoc() {
      // Prototype: real file upload comes with the backend build — this
      // demonstrates the list UI with representative document types.
      const samples = [
        { icon: '📄', name: 'Oakwood Manor Quote.pdf', type: 'Quote' },
        { icon: '📝', name: 'Photography Contract.pdf', type: 'Contract' },
        { icon: '🖼️', name: 'Florals Moodboard.jpg', type: 'Inspiration' }
      ];
      WeddingApp.updateState((s) => {
        const next = samples[s.documents.length % samples.length];
        s.documents.push(next);
        return s;
      });
      render();
    }

    render();
    WeddingApp.renderBottomNav('documents');
  </script>
</body>
</html>
