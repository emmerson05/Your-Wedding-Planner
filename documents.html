<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Documents · Your Wedding Planner</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#08A0FF" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="topbar-title">Documents</div>
      <button class="back-btn" onclick="openAddDoc()">+</button>
    </div>

    <div class="scroll-content">
      <p class="tagline" style="text-align:left; margin-bottom:20px;">Keep quotes, contracts and inspiration all in one place.</p>

      <div class="card" id="addDocCard" style="display:none;">
        <div class="card-title">Add Document</div>
        <div class="field">
          <label for="docName">Name</label>
          <input type="text" id="docName" placeholder="e.g. Oakwood Manor Quote" />
        </div>
        <div class="field" style="margin-bottom:16px;">
          <label for="docType">Type</label>
          <select id="docType" style="width:100%; padding:14px 16px; border-radius:10px; border:1.5px solid var(--color-border); font-size:16px;">
            <option value="Quote">Quote</option>
            <option value="Contract">Contract</option>
            <option value="Inspiration">Inspiration</option>
            <option value="Invoice">Invoice</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button class="btn btn-primary" onclick="addDoc()">Add to List</button>
      </div>

      <div class="card" id="emptyState" style="text-align:center; padding: 40px 20px;">
        <div style="font-size:36px;">📁</div>
        <div style="font-weight:700; margin-top:12px;">No documents yet</div>
        <div class="tagline" style="margin-top:4px;">Tap + to add your first quote, contract or inspiration file.</div>
      </div>

      <div id="docList"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    WeddingApp.requireAccount();
    WeddingApp.requireOnboarding();

    function uid() { return 'doc' + Math.random().toString(36).slice(2, 9); }

    const TYPE_ICON = {
      Quote: '📄',
      Contract: '📝',
      Inspiration: '🖼️',
      Invoice: '🧾',
      Other: '📎'
    };

    function openAddDoc() {
      document.getElementById('addDocCard').style.display = 'block';
    }

    function addDoc() {
      const name = document.getElementById('docName').value.trim();
      const type = document.getElementById('docType').value;
      if (!name) return;
      WeddingApp.updateState((s) => {
        s.documents.push({ id: uid(), icon: TYPE_ICON[type] || '📎', name, type });
        return s;
      });
      document.getElementById('docName').value = '';
      document.getElementById('addDocCard').style.display = 'none';
      render();
    }

    function deleteDoc(id) {
      WeddingApp.updateState((s) => {
        s.documents = s.documents.filter(d => d.id !== id);
        return s;
      });
      render();
    }

    function render() {
      const state = WeddingApp.getState();
      const list = document.getElementById('docList');
      list.innerHTML = '';
      document.getElementById('emptyState').style.display = state.documents.length ? 'none' : 'block';

      state.documents.forEach((d) => {
        const row = document.createElement('div');
        row.className = 'card';
        row.style.cssText = 'display:flex; align-items:center; gap:12px;';
        row.innerHTML = `
          <span style="font-size:22px;">${d.icon}</span>
          <div style="flex:1;">
            <div style="font-weight:700;">${d.name}</div>
            <div style="font-size:12px; color:var(--color-text-muted);">${d.type}</div>
          </div>
          <button style="background:none; border:none; color:var(--color-text-muted); font-size:15px; cursor:pointer;">🗑</button>
        `;
        row.querySelector('button').onclick = () => deleteDoc(d.id);
        list.appendChild(row);
      });
    }

    render();
    WeddingApp.renderBottomNav('documents');
  </script>
</body>
</html>
