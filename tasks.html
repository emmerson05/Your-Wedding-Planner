<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tasks · Your Wedding Planner</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#08A0FF" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <button class="back-btn" onclick="location.href='dashboard.html'">←</button>
      <div class="topbar-title">Tasks</div>
      <div style="width:36px;"></div>
    </div>

    <div class="scroll-content">
      <div class="card" style="text-align:center;">
        <div style="display:flex; justify-content:space-around;">
          <div><div style="font-size:20px; font-weight:700;" id="countOpen">0</div><div style="font-size:12px; color:var(--color-text-muted);">To Do</div></div>
          <div><div style="font-size:20px; font-weight:700; color:var(--color-success);" id="countDone">0</div><div style="font-size:12px; color:var(--color-text-muted);">Done</div></div>
        </div>
        <div class="progress-track" style="margin-top:12px;"><div class="progress-fill" id="progressFill"></div></div>
      </div>

      <div class="card">
        <div style="display:flex; gap:8px;">
          <input type="text" id="newTaskInput" placeholder="Add a task…" style="flex:1; padding:14px; border-radius:12px; border:1.5px solid var(--color-border); font-size:15px;" />
          <button class="btn btn-primary" style="width:auto; padding:14px 20px;" onclick="addTask()">Add</button>
        </div>
      </div>

      <div class="card-title">To Do</div>
      <div id="openList"></div>

      <div class="card-title" style="margin-top:16px;">Done</div>
      <div id="doneList"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    WeddingApp.requireAccount();
    WeddingApp.requireOnboarding();

    function uid() { return 'task' + Math.random().toString(36).slice(2, 9); }

    function addTask() {
      const input = document.getElementById('newTaskInput');
      const label = input.value.trim();
      if (!label) return;
      WeddingApp.updateState((s) => {
        s.tasks.unshift({ id: uid(), label, done: false });
        return s;
      });
      input.value = '';
      render();
    }

    function toggleTask(id) {
      WeddingApp.updateState((s) => {
        const t = s.tasks.find(t => t.id === id);
        if (t) t.done = !t.done;
        return s;
      });
      render();
    }

    function deleteTask(id) {
      WeddingApp.updateState((s) => {
        s.tasks = s.tasks.filter(t => t.id !== id);
        return s;
      });
      render();
    }

    function taskRow(task) {
      const row = document.createElement('div');
      row.className = 'card';
      row.style.cssText = 'display:flex; align-items:center; gap:10px; padding:14px 16px; margin-bottom:8px;';
      row.innerHTML = `
        <button style="width:22px; height:22px; border-radius:50%; border:1.5px solid var(--color-border); background:${task.done ? 'var(--color-success)' : 'var(--color-surface)'}; flex-shrink:0; cursor:pointer;"></button>
        <span style="flex:1; font-size:14px; ${task.done ? 'text-decoration:line-through; color:var(--color-text-muted);' : ''}">${task.label}</span>
        <button style="background:none; border:none; color:var(--color-text-muted); font-size:16px; cursor:pointer;">🗑</button>
      `;
      const [checkBtn, , delBtn] = row.querySelectorAll('button, span, button');
      row.querySelector('button').onclick = () => toggleTask(task.id);
      row.querySelectorAll('button')[1].onclick = () => deleteTask(task.id);
      return row;
    }

    function render() {
      const state = WeddingApp.getState();
      const open = state.tasks.filter(t => !t.done);
      const done = state.tasks.filter(t => t.done);

      document.getElementById('countOpen').textContent = open.length;
      document.getElementById('countDone').textContent = done.length;
      const pct = state.tasks.length ? Math.round((done.length / state.tasks.length) * 100) : 0;
      document.getElementById('progressFill').style.width = pct + '%';

      const openList = document.getElementById('openList');
      openList.innerHTML = '';
      if (!open.length) {
        const empty = document.createElement('div');
        empty.className = 'tagline';
        empty.style.textAlign = 'center';
        empty.textContent = 'Nothing to do — add a task above.';
        openList.appendChild(empty);
      } else {
        open.forEach(t => openList.appendChild(taskRow(t)));
      }

      const doneList = document.getElementById('doneList');
      doneList.innerHTML = '';
      if (!done.length) {
        const empty = document.createElement('div');
        empty.className = 'tagline';
        empty.style.textAlign = 'center';
        empty.textContent = 'Nothing completed yet.';
        doneList.appendChild(empty);
      } else {
        done.forEach(t => doneList.appendChild(taskRow(t)));
      }
    }

    document.getElementById('newTaskInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    render();
  </script>
</body>
</html>
