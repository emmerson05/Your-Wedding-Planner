<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Your Wedding Planner</title>
  <meta name="description" content="Plan your wedding with confidence — your personal AI wedding planning companion." />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#08A0FF" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wedding Planner" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="screen screen-center">
      <div class="logo-mark"><img src="icons/dog-mascot-cream.png" alt="Your Wedding Planner mascot" /></div>

      <h1 style="margin-top: 24px; font-size: 28px;">Your Wedding Planner</h1>
      <p class="tagline">Plan your wedding with confidence.<br />Your personal wedding planning companion.</p>

      <div class="stack">
        <button class="btn btn-primary" onclick="location.href='signup.html'">Create Account</button>
        <button class="btn btn-secondary" onclick="location.href='login.html'">Log In</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>

</html>
