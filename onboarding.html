<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Let's Plan · Your Wedding Planner</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#08A0FF" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar" style="padding-bottom: 0;">
      <button class="back-btn" id="backBtn" onclick="goBack()">←</button>
      <div class="topbar-title">Let's get to know you</div>
      <div style="width:36px;"></div>
    </div>

    <div class="screen" style="padding-top: 8px;">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel">Question 1 of 5</div>

      <h2 id="questionText" style="font-size: 22px; line-height: 1.3;"></h2>

      <div id="answerContainer"></div>

      <div style="flex:1;"></div>

      <button class="btn btn-primary" id="nextBtn" onclick="goNext()" style="margin-top: 32px;">Next</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/onboarding.js"></script>
</body>
</html>
