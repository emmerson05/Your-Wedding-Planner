<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Budget · Your Wedding Planner</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#08A0FF" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <div class="topbar-title">Budget</div>
      <div style="width:36px;"></div>
    </div>

    <div class="scroll-content">
      <div class="card" style="text-align:center;">
        <div class="card-title">Total Spent</div>
        <div style="font-family: var(--font-heading); font-size: 32px;" id="totalLine">£0 / £0</div>
        <div class="progress-track" style="margin-top:12px;"><div class="progress-fill" id="budgetFill"></div></div>
        <div style="font-size:13px; color:var(--color-text-muted); margin-top:6px;" id="remainingLine"></div>
      </div>

      <div class="card">
        <div class="card-title">Adjust Total Budget</div>
        <div class="field" style="margin-bottom:8px;">
          <input type="number" id="budgetInput" style="width:100%; padding:14px; border-radius:12px; border:1.5px solid var(--color-border); font-size:16px;" />
        </div>
        <button class="btn btn-secondary" onclick="updateBudget()">Save</button>
      </div>

      <div class="card">
        <div class="card-title">Spending Breakdown</div>
        <div id="breakdownList"></div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    WeddingApp.requireAccount();
    WeddingApp.requireOnboarding();
    let state = WeddingApp.getState();

    function render() {
      state = WeddingApp.getState();
      document.getElementById('totalLine').textContent = `${WeddingApp.formatCurrency(state.budget.spent)} / ${WeddingApp.formatCurrency(state.budget.total)}`;
      document.getElementById('budgetFill').style.width = Math.min(100, Math.round((state.budget.spent / state.budget.total) * 100)) + '%';
      document.getElementById('remainingLine').textContent = `${WeddingApp.formatCurrency(state.budget.total - state.budget.spent)} remaining`;
      document.getElementById('budgetInput').value = state.budget.total;

      const breakdown = [
        { label: 'Venue', pct: 0.4 },
        { label: 'Catering', pct: 0.25 },
        { label: 'Photography', pct: 0.15 },
        { label: 'Flowers & Décor', pct: 0.1 },
        { label: 'Other', pct: 0.1 }
      ];
      const list = document.getElementById('breakdownList');
      list.innerHTML = '';
      breakdown.forEach(b => {
        const row = document.createElement('div');
        row.style.cssText = 'display:flex; justify-content:space-between; padding:8px 0; font-size:14px; border-bottom:1px solid var(--color-border);';
        row.innerHTML = `<span>${b.label}</span><span style="font-weight:600;">${WeddingApp.formatCurrency(Math.round(state.budget.spent * b.pct))}</span>`;
        list.appendChild(row);
      });
    }

    function updateBudget() {
      const val = Number(document.getElementById('budgetInput').value);
      if (!val || val <= 0) return;
      WeddingApp.updateState((s) => { s.budget.total = val; return s; });
      render();
    }

    render();
    WeddingApp.renderBottomNav('budget');
  </script>
</body>
</html>
