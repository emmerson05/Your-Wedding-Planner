<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Settings · Your Wedding Planner</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#08A0FF" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <button class="back-btn" onclick="location.href='dashboard.html'">←</button>
      <div class="topbar-title">Settings</div>
      <div style="width:36px;"></div>
    </div>

    <div class="scroll-content">
      <div class="card">
        <div class="card-title">Account</div>
        <div style="font-weight:700; font-size:17px;" id="settingsNames"></div>
        <div style="font-size:14px; color:var(--color-text-muted); margin-top:2px;" id="settingsEmail"></div>
      </div>

      <div class="card">
        <div class="card-title">Wedding Details</div>
        <div style="font-size:14px; color:var(--color-text-muted);">Editing your onboarding answers is coming soon.</div>
      </div>

      <button class="btn btn-secondary" onclick="resetProto()">Reset Prototype Data</button>
      <div style="height:12px;"></div>
      <button class="btn btn-ghost" onclick="logout()">Log Out</button>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    WeddingApp.requireAccount();
    const state = WeddingApp.getState();
    document.getElementById('settingsNames').textContent = state.account.names || '—';
    document.getElementById('settingsEmail').textContent = state.account.email || '';

    function logout() {
      localStorage.removeItem(WeddingApp.STORAGE_KEY);
      window.location.href = 'index.html';
    }
    function resetProto() {
      if (confirm('This clears all prototype data (account, answers, budget etc). Continue?')) {
        localStorage.removeItem(WeddingApp.STORAGE_KEY);
        window.location.href = 'index.html';
      }
    }
  </script>
</body>
</html>
