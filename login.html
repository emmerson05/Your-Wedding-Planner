<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Log In · Your Wedding Planner</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#08A0FF" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <button class="back-btn" onclick="location.href='index.html'">←</button>
      <div class="topbar-title">Log In</div>
      <div style="width:36px;"></div>
    </div>

    <form class="screen" id="loginForm" onsubmit="return handleLogin(event)">
      <div class="logo-mark" style="width:72px; height:72px; margin-bottom:16px;"><img src="icons/dog-mascot-cream.png" alt="Your Wedding Planner mascot" /></div>
      <p class="tagline" style="text-align:left; margin-bottom: 24px;">Welcome back.</p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required />
      </div>

      <div class="link-row" style="margin-top:-8px; margin-bottom: 8px;">
        <a href="#" onclick="alert('Password reset coming soon in a later screen.'); return false;">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary">Log In</button>

      <div class="link-row" style="text-align:center; width:100%;">
        New here? <a href="index.html">Start here</a>
      </div>
    </form>
  </div>

  <script src="js/app.js"></script>
  <script>
    // Note: this page isn't linked from the main flow anymore — names are
    // captured on index.html instead. There's no real backend auth here, so
    // "logging in" only makes sense if a local session already exists; if
    // not, send people to the real entry point rather than fabricating an
    // account under someone else's name.
    function handleLogin(e) {
      e.preventDefault();
      const state = WeddingApp.getState();
      if (!state.account) {
        window.location.href = 'index.html';
        return false;
      }
      window.location.href = state.onboarding.complete ? 'dashboard.html' : 'welcome.html';
      return false;
    }
  </script>
</body>
</html>
