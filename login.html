<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Log In · Your Wedding Planner</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#08A0FF" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="topbar">
      <button class="back-btn" onclick="location.href='index.html'">←</button>
      <div class="topbar-title">Log In</div>
      <div style="width:36px;"></div>
    </div>

    <form class="screen" id="loginForm" onsubmit="return handleLogin(event)">
      <p class="tagline" style="text-align:left; margin-bottom: 24px;">Welcome back.</p>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password" required />
      </div>

      <div class="link-row" style="margin-top:-8px; margin-bottom: 8px;">
        <a href="#" onclick="alert('Password reset coming soon in a later screen.'); return false;">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-primary">Log In</button>

      <div class="link-row" style="text-align:center; width:100%;">
        New here? <a href="signup.html">Create an account</a>
      </div>
    </form>
  </div>

  <script src="js/app.js"></script>
  <script>
    function handleLogin(e) {
      e.preventDefault();
      // Prototype: no real auth yet — logs in as existing account if present,
      // otherwise creates a lightweight session so the flow can be tested.
      const state = WeddingApp.getState();
      if (!state.account) {
        const email = document.getElementById('email').value.trim();
        WeddingApp.updateState((s) => {
          s.account = { names: 'Alex & Emma', email };
          return s;
        });
      }
      const s2 = WeddingApp.getState();
      window.location.href = s2.onboarding.complete ? 'dashboard.html' : 'welcome.html';
      return false;
    }
  </script>
</body>
</html>
