<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Welcome · Your Wedding Planner</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#08A0FF" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <div class="screen screen-center" id="screenContent">
      <!-- populated by script -->
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    WeddingApp.requireAccount();
    const content = document.getElementById('screenContent');

    function renderMeetRag() {
      content.innerHTML = `
        <div class="logo-mark"><img src="icons/dog-mascot-cream.png" alt="Rag, your wedding planning mascot" /></div>

        <h1 style="margin-top: 20px; font-size: 24px;">Meet Rag</h1>
        <p class="tagline">Your wedding planning sidekick. Rag's here to help you plan the perfect day — keeping things on track, on time, and within budget.</p>
        <p class="tagline" style="font-weight:700; color:var(--color-primary-dark); margin-top:10px;">Let's enjoy the journey together!</p>

        <form id="namesForm" style="width:100%; margin-top:28px; text-align:left;">
          <p style="font-weight:700; margin-bottom:16px;">First... who's the happy couple?</p>
          <div class="field">
            <label for="p1">Your name</label>
            <input type="text" id="p1" placeholder="e.g. Alex" required />
          </div>
          <div class="field" style="margin-bottom:8px;">
            <label for="p2">Partner's name</label>
            <input type="text" id="p2" placeholder="e.g. Emma" required />
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top:16px;">Continue</button>
        </form>
      `;

      document.getElementById('namesForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const p1 = document.getElementById('p1').value.trim();
        const p2 = document.getElementById('p2').value.trim();
        if (!p1 || !p2) return;

        WeddingApp.updateState((s) => {
          s.account.names = `${p1} & ${p2}`;
          return s;
        });
        renderWelcome();
      });
    }

    function renderWelcome() {
      const state = WeddingApp.getState();
      content.innerHTML = `
        <div class="logo-mark" style="width:80px; height:80px;"><img src="icons/dog-mascot-cream.png" alt="Rag, your wedding planning mascot" /></div>
        <h1 style="margin-top: 20px; font-size: 26px;">Welcome, ${state.account.names}!</h1>
        <p class="tagline">Congratulations on your engagement!<br />We're going to build your personal wedding planner.</p>
        <p class="tagline" style="margin-top: 12px; font-weight: 700; color: var(--color-primary-dark);">Just 5 quick questions — about 60 seconds — and every recommendation from then on will be personalised to you.</p>

        <div class="stack">
          <button class="btn btn-primary" id="beginBtn">Let's Begin</button>
        </div>
      `;
      document.getElementById('beginBtn').onclick = () => { window.location.href = 'onboarding.html'; };
    }

    const state = WeddingApp.getState();
    if (state.onboarding.complete) {
      window.location.href = 'dashboard.html';
    } else if (!state.account.names) {
      renderMeetRag();
    } else {
      renderWelcome();
    }
  </script>
</body>
</html>
